<text x="325.0" y="106.1" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="middle">Coarse ADC → DAC</text>
<text x="325.0" y="122.2" font-size="11.5" font-weight="400" fill="#0b0b0b" text-anchor="middle">VDAC = Dcoarse · 0.125 V</text>
<polyline points="325,138 325,252 174,252" fill="none" stroke="#3a3a38" stroke-width="2" marker-end="url(#arr)"/>
<text x="334" y="200" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="700">VDAC</text>
