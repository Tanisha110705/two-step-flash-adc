<line x1="520" y1="80" x2="520" y2="400" stroke="#52514e" stroke-width="1.5"/>
<polyline points="520.0,400.0 546.2,80.0 546.2,400.0 572.5,80.0 572.5,400.0 598.8,80.0 598.8,400.0 625.0,80.0 625.0,400.0 651.2,80.0 651.2,400.0 677.5,80.0 677.5,400.0 703.8,80.0 703.8,400.0 730.0,80.0 730.0,400.0 756.2,80.0 756.2,400.0 782.5,80.0 782.5,400.0 808.8,80.0 808.8,400.0 835.0,80.0 835.0,400.0 861.2,80.0 861.2,400.0 887.5,80.0 887.5,400.0 913.8,80.0 913.8,400.0 940.0,80.0" fill="none" stroke="#eb6834" stroke-width="2" stroke-linejoin="round"/>
<text x="730.0" y="440" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="400">Vin (V)</text>
<text x="480" y="240.0" font-size="12" fill="#0b0b0b" text-anchor="middle" transform="rotate(-90 480 240.0)">Vres (V)</text>
<text x="730.0" y="462" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400">16 ramps of 0–2 V, one per coarse segment (Vres = 16·(Vin − ⌊Vin/0.125⌋·0.125))</text>
</svg>
