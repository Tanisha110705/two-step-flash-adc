<text x="512" y="324.0" font-size="11" fill="#52514e" text-anchor="end" font-weight="400">0.5</text>
<line x1="730.0" y1="80" x2="730.0" y2="400" stroke="#e4e3df" stroke-width="1"/>
<line x1="520" y1="240.0" x2="940" y2="240.0" stroke="#e4e3df" stroke-width="1"/>
<text x="730.0" y="418" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400">1.0</text>
<text x="512" y="244.0" font-size="11" fill="#52514e" text-anchor="end" font-weight="400">1.0</text>
<line x1="835.0" y1="80" x2="835.0" y2="400" stroke="#e4e3df" stroke-width="1"/>
<line x1="520" y1="160.0" x2="940" y2="160.0" stroke="#e4e3df" stroke-width="1"/>
<text x="835.0" y="418" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400">1.5</text>
<text x="512" y="164.0" font-size="11" fill="#52514e" text-anchor="end" font-weight="400">1.5</text>
<line x1="940.0" y1="80" x2="940.0" y2="400" stroke="#e4e3df" stroke-width="1"/>
<line x1="520" y1="80.0" x2="940" y2="80.0" stroke="#e4e3df" stroke-width="1"/>
<text x="940.0" y="418" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400">2.0</text>
<text x="512" y="84.0" font-size="11" fill="#52514e" text-anchor="end" font-weight="400">2.0</text>
