<text x="150" y="259" font-size="18" fill="#0b0b0b" text-anchor="middle" font-weight="700">Σ</text>
<text x="138" y="222" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="700">+</text>
<text x="182" y="245" font-size="16" fill="#0b0b0b" text-anchor="middle" font-weight="700">−</text>
<polyline points="150,274 150,318" fill="none" stroke="#3a3a38" stroke-width="2" marker-end="url(#arr)"/>
<text x="162" y="296" font-size="11.5" fill="#0b0b0b" text-anchor="start" font-weight="400">Vin − VDAC  (0 … 0.125 V)</text>
<polygon points="110,320 190,320 150,380" fill="#fdeee7" stroke="#eb6834" stroke-width="2"/>
<text x="150" y="345" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="700">×16</text>
<text x="202" y="352" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400">residue amplifier (2^4)</text>
<polyline points="150,380 150,418" fill="none" stroke="#3a3a38" stroke-width="2" marker-end="url(#arr)"/>
<text x="162" y="404" font-size="11.5" fill="#0b0b0b" text-anchor="start" font-weight="700">Vres  (0 … 2 V)</text>
<rect x="60" y="420" width="180" height="46" rx="8" fill="#e5f6ef" stroke="#1a9e6f" stroke-width="2"/>
<text x="150.0" y="446.9" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="middle">Fine ADC (4-bit)</text>
<text x="730.0" y="62" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="700">Vres versus Vin in the model</text>
<line x1="520.0" y1="80" x2="520.0" y2="400" stroke="#e4e3df" stroke-width="1"/>
<line x1="520" y1="400.0" x2="940" y2="400.0" stroke="#e4e3df" stroke-width="1"/>
