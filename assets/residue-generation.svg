<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Residue generation">
<title>Residue generation</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#3a3a38"/>
  </marker>
</defs>
<rect x="0" y="0" width="1000" height="490" fill="#ffffff"/>
<text x="500" y="30" font-size="17" fill="#0b0b0b" text-anchor="middle" font-weight="700">Residue generation: subtract the DAC estimate, amplify by 16</text>
<text x="150" y="66" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="700">Vin</text>
<polyline points="150,74 150,228" fill="none" stroke="#3a3a38" stroke-width="2" marker-end="url(#arr)"/>
<circle cx="150" cy="110" r="4" fill="#3a3a38"/>
<polyline points="150,110 228,110" fill="none" stroke="#3a3a38" stroke-width="2" marker-end="url(#arr)"/>
