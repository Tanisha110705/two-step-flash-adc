<text x="60" y="394" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="400">Fine stage: 16 segments of 0.125 V on the amplified residue = 0.125 V / 16 = 7.8125 mV (1 LSB) referred to the input.</text>
<text x="60" y="414" font-size="12.5" fill="#0b0b0b" text-anchor="start" font-weight="700">Result: Dcoarse = 9, Dfine = 13  →  Dout = 9 × 16 + 13 = 157.</text>
