<text x="390" y="302" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="700">Dout[7:0] = 1001 1101b = 144 + 13 = 157   (valid range 0–255)</text>
<text x="390" y="324" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="400" font-style="italic">Each stage is clamped to 0–15, so the fine code never carries into the coarse bits.</text>
