<svg xmlns="http://www.w3.org/2000/svg" width="780" height="344" viewBox="0 0 780 344" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Digital output code reconstruction">
<title>Digital output code reconstruction</title>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#3a3a38"/>
