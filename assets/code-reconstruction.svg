<text x="60" y="168" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">× 16  (shift left by 4)</text>
<text x="510" y="82" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="700">Dfine = 13</text>
