<text x="390" y="30" font-size="16" fill="#0b0b0b" text-anchor="middle" font-weight="700">Digital output reconstruction: Dout = Dcoarse × 16 + Dfine</text>
<text x="60" y="82" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="700">Dcoarse = 9</text>
